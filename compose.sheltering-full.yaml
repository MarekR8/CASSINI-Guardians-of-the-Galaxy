# SH-T06 Stage B: Sheltering and Routing publish their outboxes to RabbitMQ (evacuation.events) and Sheltering's
# instruction board consumes them. Use with compose.yaml and compose.sheltering.yaml; add
# compose.sheltering-postgres.yaml for the PostgreSQL store. The first run needs internet to pull the broker image.
#   RABBITMQ_PASSWORD=… docker compose -f compose.yaml -f compose.sheltering.yaml -f compose.sheltering-full.yaml \
#     --profile full up -d --build
x-live-bus: &live-bus
  Integrations__Bus__Mode: live
  Integrations__Bus__Uri: amqp://${RABBITMQ_USER:-cassini}:${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD}@rabbitmq:5672/

services:
  routing:
    image: cassini-offline/routing:full
    build:
      args:
        ENABLE_RABBITMQ: "true"
    environment: *live-bus
    depends_on:
      rabbitmq:
        condition: service_healthy

  sheltering:
    image: cassini-offline/sheltering:full
    build:
      args:
        ENABLE_RABBITMQ: "true"
    environment: *live-bus
    depends_on:
      rabbitmq:
        condition: service_healthy

  rabbitmq:
    profiles: [full]
    image: rabbitmq:4.4-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-cassini}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD}
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      interval: 3s
      timeout: 5s
      retries: 20
    networks: [operations, local-ui]
    ports: ["127.0.0.1:${RABBITMQ_UI_PORT:-15672}:15672"]
    volumes: [rabbitmq:/var/lib/rabbitmq]

volumes:
  rabbitmq:
