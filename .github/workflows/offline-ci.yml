name: Offline demo CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Check Compose
        run: |
          docker compose config --quiet
          docker compose -f compose.yaml -f compose.valencia.yaml config --quiet
          docker compose -f compose.yaml -f compose.sheltering.yaml config --quiet
          SHELTERING_DB_CONNECTION=ci SHELTERING_DB_PASSWORD=ci docker compose -f compose.yaml -f compose.sheltering.yaml -f compose.sheltering-postgres.yaml --profile full config --quiet
          RABBITMQ_PASSWORD=ci docker compose -f compose.yaml -f compose.sheltering.yaml -f compose.sheltering-full.yaml --profile full config --quiet
      - name: Run the offline regression and mandatory default Sheltering journey
        run: python3 scripts/offline_demo.py --test
      - name: Verify the shelter and assembly point catalogs
        run: python3 scripts/offline_demo.py --sheltering --test --no-build
      - name: Verify first legs and shelter destinations (SH-A01)
        run: python3 tests/destination_routing_integration.py --no-build
      - name: Verify Grouping through the Gateway (SH-A02, SH-A03 and incident scope)
        run: python3 tests/grouping_integration.py --no-build
      - name: Verify shelter reservations and reassignment (SH-A04, SH-A06)
        run: python3 tests/sheltering_reservations_integration.py --no-build
      - name: Verify shelter route publication and withdrawal (SH-A06, SH-A07)
        run: python3 tests/sheltering_publication_integration.py --no-build
      - name: Verify the SH-W5 instruction replay without a broker
        run: dotnet run --no-build --project src/Sheltering/tests/Cassini.Sheltering.Tests.csproj
      - name: Verify Dispatch with replay and an ORS HTTP stub
        run: python3 tests/dispatch_ors_integration.py
      - name: Verify Routing rules
        run: dotnet run --no-build --project src/Routing/tests/Cassini.Routing.Tests.csproj
      - name: Verify Management progress, counters, EWSS and the Grouping outbox
        run: dotnet run --no-build --project src/Management/tests/Cassini.Management.Tests.csproj
      - name: Verify the Gateway link simulator
        run: dotnet run --no-build --project src/Gateway/tests/Gateway.Tests.csproj
      - name: Verify the in-memory event bus and outbox
        run: dotnet run --no-build --project src/Shared/Messaging/tests/Cassini.Messaging.Tests.csproj
      - name: Verify Android offline logic without an emulator
        run: dotnet run --project apps/offline-android/tests/Offline.Tests.csproj -p:NuGetAudit=false

  verify-site-catalog-stage-b:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: catalog_ci
          POSTGRES_PASSWORD: catalog-ci-only
          POSTGRES_DB: assembly_catalog
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U catalog_ci -d assembly_catalog"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Build the optional authenticated catalogs
        run: dotnet build Cassini.Offline.slnx -m:1 -p:EnableSiteCatalogStageB=true -p:EnableShelteringPostgres=true
      - name: Verify OIDC scopes and durable local outboxes
        run: python3 tests/sheltering_stage_b.py
      - name: Migrate both catalog databases
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec "$POSTGRES_CONTAINER" createdb -U catalog_ci shelter_catalog
          for db in assembly_catalog shelter_catalog; do
            docker exec -i "$POSTGRES_CONTAINER" psql -X -v ON_ERROR_STOP=1 -U catalog_ci -d "$db" < src/Demo/SiteCatalog/001-site-catalog.sql
          done
      - name: Verify PostgreSQL restart and pending events
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          ConnectionStrings__AssemblyPointCatalog: Host=127.0.0.1;Port=${{ job.services.postgres.ports[5432] }};Database=assembly_catalog;Username=catalog_ci;Password=catalog-ci-only
          ConnectionStrings__ShelterCatalog: Host=127.0.0.1;Port=${{ job.services.postgres.ports[5432] }};Database=shelter_catalog;Username=catalog_ci;Password=catalog-ci-only
        run: |
          python3 tests/sheltering_stage_b.py --postgres
          query="SELECT (snapshot->>'revision') || ':' || jsonb_array_length(snapshot->'audit') || ':' || jsonb_array_length(snapshot->'outbox') FROM cassini_site_catalog"
          test "$(docker exec "$POSTGRES_CONTAINER" psql -XAt -U catalog_ci -d assembly_catalog -c "$query")" = "1:1:1"
          test "$(docker exec "$POSTGRES_CONTAINER" psql -XAt -U catalog_ci -d shelter_catalog -c "$query")" = "2:2:2"
      - name: Verify SH-T01 with the allocation database
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          ConnectionStrings__AssemblyPointCatalog: Host=127.0.0.1;Port=${{ job.services.postgres.ports[5432] }};Database=assembly_integrated;Username=catalog_ci;Password=catalog-ci-only
          ConnectionStrings__Sheltering: Host=127.0.0.1;Port=${{ job.services.postgres.ports[5432] }};Database=shelter_catalog;Username=catalog_ci;Password=catalog-ci-only
        run: |
          docker exec "$POSTGRES_CONTAINER" createdb -U catalog_ci assembly_integrated
          docker exec -i "$POSTGRES_CONTAINER" psql -X -v ON_ERROR_STOP=1 -U catalog_ci -d assembly_integrated < src/Demo/SiteCatalog/001-site-catalog.sql
          python3 tests/sheltering_stage_b.py --postgres
          query="SELECT (SELECT count(*) FROM sheltering_catalog_audit) || ':' || (SELECT count(*) FROM sheltering_catalog_outbox)"
          test "$(docker exec "$POSTGRES_CONTAINER" psql -XAt -U catalog_ci -d shelter_catalog -c "$query")" = "2:2"

  verify-sheltering-browser:
    # SH-T07 Stage B: coordinator and shelter operator journey in headless Chromium.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright and Chromium
        run: |
          python -m pip install playwright==1.49.1
          python -m playwright install --with-deps chromium
      - name: Run the dashboard journey (scopes, separate facts, stale projection)
        run: python tests/sheltering_browser.py --screenshots artifacts/sheltering-browser
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sheltering-browser
          path: artifacts/sheltering-browser
          if-no-files-found: ignore

  verify-sheltering-images:
    # SH-T07 / SH-A08: the sample regression and the sheltering exercise on prebuilt images, without pulls or
    # builds at run time, from empty volumes. The owners run on the internal network (no internet).
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: Build the images (the only step with network access to registries)
        run: docker compose build
      - name: Rehearse on prebuilt images
        run: python3 tests/sheltering_rehearsal.py --images-only
      - name: Keep the rehearsal report and service logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sheltering-rehearsal
          path: |
            artifacts/sheltering-rehearsal.json
            artifacts/rehearsal-*.log
          if-no-files-found: ignore

  verify-routing-model:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: experiments/routing/requirements.txt
      - name: Install the task 03 reference model
        run: python -m pip install -r experiments/routing/requirements.txt
      - name: Verify the reference model and its inputs
        run: python -m unittest discover -s experiments/routing -v
      - name: Verify expected.json is reproduced by the model
        run: python experiments/routing/fixtures.py --check

  verify-dispatch-notifications:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      rabbitmq:
        image: rabbitmq:4-management
        env:
          RABBITMQ_DEFAULT_USER: dispatch-ci
          RABBITMQ_DEFAULT_PASS: dispatch-ci-only
        ports:
          - 5672/tcp
          - 15672/tcp
        options: >-
          --health-cmd "rabbitmq-diagnostics -q check_port_connectivity"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Build Dispatch with RabbitMQ support
        run: dotnet build Cassini.Offline.slnx -m:1 -p:NuGetAudit=false -p:EnableDispatchRabbitMq=true
      - name: Verify both RabbitMQ notifications
        env:
          ConnectionStrings__DispatchRabbitMq: amqp://dispatch-ci:dispatch-ci-only@127.0.0.1:${{ job.services.rabbitmq.ports[5672] }}/%2F
          RABBITMQ_TEST_USERNAME: dispatch-ci
          RABBITMQ_TEST_PASSWORD: dispatch-ci-only
        run: python3 tests/dispatch_ors_integration.py --rabbit-management http://127.0.0.1:${{ job.services.rabbitmq.ports[15672] }}

  verify-dispatch-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: dispatch
          POSTGRES_PASSWORD: dispatch-ci-only
          POSTGRES_DB: dispatch
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U dispatch -d dispatch"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Build the optional PostgreSQL backend
        run: dotnet build Cassini.Offline.slnx -m:1 -p:NuGetAudit=false -p:EnableDispatchPostgres=true
      - name: Verify concurrent booking and restart with PostgreSQL
        env:
          ConnectionStrings__Dispatch: Host=127.0.0.1;Port=${{ job.services.postgres.ports[5432] }};Database=dispatch;Username=dispatch;Password=dispatch-ci-only
        run: python3 tests/dispatch_postgres_integration.py

  verify-sheltering-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: sheltering
          POSTGRES_PASSWORD: sheltering-ci-only
          POSTGRES_DB: sheltering
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U sheltering -d sheltering"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Build the optional Sheltering PostgreSQL store
        run: dotnet build Cassini.Offline.slnx -m:1 -p:NuGetAudit=false -p:EnableShelteringPostgres=true
      - name: Verify two Sheltering instances, duplicates, stale writes and restart with PostgreSQL
        env:
          ConnectionStrings__Sheltering: Host=127.0.0.1;Port=${{ job.services.postgres.ports[5432] }};Database=sheltering;Username=sheltering;Password=sheltering-ci-only
        run: python3 tests/sheltering_postgres_integration.py --no-build

  verify-sheltering-events:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: sheltering
          POSTGRES_PASSWORD: sheltering-ci-only
          POSTGRES_DB: sheltering
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U sheltering -d sheltering"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
      rabbitmq:
        image: rabbitmq:4.4-management
        ports:
          - 5672/tcp
          - 15672/tcp
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Build Sheltering and Routing with RabbitMQ and the PostgreSQL store
        run: dotnet build Cassini.Offline.slnx -m:1 -p:NuGetAudit=false -p:EnableRabbitMq=true -p:EnableShelteringPostgres=true
      - name: Verify outboxes on RabbitMQ, redelivery, reordering and restart after commit
        env:
          RABBITMQ_URI: amqp://guest:guest@127.0.0.1:${{ job.services.rabbitmq.ports[5672] }}/
          RABBITMQ_API: http://127.0.0.1:${{ job.services.rabbitmq.ports[15672] }}
          ConnectionStrings__Sheltering: Host=127.0.0.1;Port=${{ job.services.postgres.ports[5432] }};Database=sheltering;Username=sheltering;Password=sheltering-ci-only
        run: python3 tests/sheltering_events_integration.py --no-build
      - name: Verify site catalog publication and RabbitMQ redelivery
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          RABBITMQ_URI: amqp://guest:guest@127.0.0.1:${{ job.services.rabbitmq.ports[5672] }}/
          RABBITMQ_API: http://127.0.0.1:${{ job.services.rabbitmq.ports[15672] }}
          ConnectionStrings__Sheltering: Host=127.0.0.1;Port=${{ job.services.postgres.ports[5432] }};Database=site_catalog_events;Username=sheltering;Password=sheltering-ci-only
        run: |
          docker exec "$POSTGRES_CONTAINER" createdb -U sheltering site_catalog_events
          python3 tests/sheltering_site_events_integration.py
          query="SELECT count(*) FROM sheltering_catalog_outbox WHERE document->>'publishedAt' IS NOT NULL"
          test "$(docker exec "$POSTGRES_CONTAINER" psql -XAt -U sheltering -d site_catalog_events -c "$query")" = "1"

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: tests/e2e
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json
      - name: Install Playwright
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build the stack
        working-directory: .
        run: docker compose build
      - name: Start the stack (sample scenario)
        working-directory: .
        run: docker compose up -d --wait
      - name: Run the end-to-end test
        run: npx playwright test
      - name: Show service logs
        if: failure()
        working-directory: .
        run: docker compose logs --no-color
      - name: Upload the Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/e2e/playwright-report/
          retention-days: 14
      - name: Stop the stack
        if: always()
        working-directory: .
        run: docker compose down -v

  verify-management-full:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: management
          POSTGRES_PASSWORD: management-ci-only
          POSTGRES_DB: management_db
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U management -d management_db"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
      rabbitmq:
        image: rabbitmq:4.4-management
        ports:
          - 5672/tcp
          - 15672/tcp
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Verify the event bus on RabbitMQ (stop, publish, start, dedup)
        env:
          RABBITMQ_URI: amqp://guest:guest@127.0.0.1:${{ job.services.rabbitmq.ports[5672] }}/
        run: dotnet run --project src/Shared/Messaging/tests/Cassini.Messaging.Tests.csproj -p:NuGetAudit=false -p:EnableRabbitMq=true
      - name: Verify Management on PostgreSQL with RabbitMQ
        env:
          RABBITMQ_URI: amqp://guest:guest@127.0.0.1:${{ job.services.rabbitmq.ports[5672] }}/
          RABBITMQ_API: http://127.0.0.1:${{ job.services.rabbitmq.ports[15672] }}
          ConnectionStrings__Management: Host=127.0.0.1;Port=${{ job.services.postgres.ports[5432] }};Database=management_db;Username=management;Password=management-ci-only
          PSQL_URL: postgresql://management:management-ci-only@127.0.0.1:${{ job.services.postgres.ports[5432] }}/management_db
        run: python3 tests/management_full_integration.py
