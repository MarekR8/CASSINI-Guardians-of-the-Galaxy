services:
  dispatch:
    image: cassini-offline/dispatch:postgres
    build:
      args:
        ENABLE_DISPATCH_POSTGRES: "true"
    environment:
      ConnectionStrings__Dispatch: ${DISPATCH_DB_CONNECTION:?Set DISPATCH_DB_CONNECTION}
    depends_on:
      dispatch-db:
        condition: service_healthy
      management:
        condition: service_started
      situation:
        condition: service_started
      routing:
        condition: service_started

  dispatch-db:
    profiles: [full]
    image: postgres:17
    environment:
      POSTGRES_DB: dispatch
      POSTGRES_USER: dispatch
      POSTGRES_PASSWORD: ${DISPATCH_DB_PASSWORD:?Set DISPATCH_DB_PASSWORD}
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U dispatch -d dispatch"]
      interval: 2s
      timeout: 3s
      retries: 15
    networks: [operations]
    volumes: [dispatch-db:/var/lib/postgresql/data]

volumes:
  dispatch-db:
