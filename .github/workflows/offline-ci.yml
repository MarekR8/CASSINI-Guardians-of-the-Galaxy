name: Offline demo CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Check Compose
        run: |
          docker compose config --quiet
          docker compose -f compose.yaml -f compose.sheltering.yaml config --quiet
      - name: Run the offline integration scenario
        run: python3 scripts/offline_demo.py --test
      - name: Verify the shelter and assembly point catalogs
        run: python3 scripts/offline_demo.py --sheltering --test --no-build
      - name: Verify Dispatch with replay and an ORS HTTP stub
        run: python3 tests/dispatch_ors_integration.py
      - name: Verify Routing rules
        run: dotnet run --no-build --project src/Routing/tests/Cassini.Routing.Tests.csproj
      - name: Verify Android offline logic without an emulator
        run: dotnet run --project apps/offline-android/tests/Offline.Tests.csproj -p:NuGetAudit=false

  verify-site-catalog-stage-b:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: catalog_ci
          POSTGRES_PASSWORD: catalog-ci-only
          POSTGRES_DB: assembly_catalog
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U catalog_ci -d assembly_catalog"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Build the optional authenticated catalogs
        run: dotnet build Cassini.Offline.slnx -m:1 -p:EnableSiteCatalogStageB=true
      - name: Verify OIDC scopes and durable local outboxes
        run: python3 tests/sheltering_stage_b.py
      - name: Migrate both catalog databases
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec "$POSTGRES_CONTAINER" createdb -U catalog_ci shelter_catalog
          for db in assembly_catalog shelter_catalog; do
            docker exec -i "$POSTGRES_CONTAINER" psql -X -v ON_ERROR_STOP=1 -U catalog_ci -d "$db" < src/Demo/SiteCatalog/001-site-catalog.sql
          done
      - name: Verify PostgreSQL restart and pending events
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          ConnectionStrings__AssemblyPointCatalog: Host=127.0.0.1;Port=${{ job.services.postgres.ports[5432] }};Database=assembly_catalog;Username=catalog_ci;Password=catalog-ci-only
          ConnectionStrings__ShelterCatalog: Host=127.0.0.1;Port=${{ job.services.postgres.ports[5432] }};Database=shelter_catalog;Username=catalog_ci;Password=catalog-ci-only
        run: |
          python3 tests/sheltering_stage_b.py --postgres
          query="SELECT (snapshot->>'revision') || ':' || jsonb_array_length(snapshot->'audit') || ':' || jsonb_array_length(snapshot->'outbox') FROM cassini_site_catalog"
          test "$(docker exec "$POSTGRES_CONTAINER" psql -XAt -U catalog_ci -d assembly_catalog -c "$query")" = "1:1:1"
          test "$(docker exec "$POSTGRES_CONTAINER" psql -XAt -U catalog_ci -d shelter_catalog -c "$query")" = "2:2:2"

  verify-dispatch-notifications:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      rabbitmq:
        image: rabbitmq:4-management
        env:
          RABBITMQ_DEFAULT_USER: dispatch-ci
          RABBITMQ_DEFAULT_PASS: dispatch-ci-only
        ports:
          - 5672/tcp
          - 15672/tcp
        options: >-
          --health-cmd "rabbitmq-diagnostics -q check_port_connectivity"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Build Dispatch with RabbitMQ support
        run: dotnet build Cassini.Offline.slnx -m:1 -p:NuGetAudit=false -p:EnableDispatchRabbitMq=true
      - name: Verify both RabbitMQ notifications
        env:
          ConnectionStrings__DispatchRabbitMq: amqp://dispatch-ci:dispatch-ci-only@127.0.0.1:${{ job.services.rabbitmq.ports[5672] }}/%2F
          RABBITMQ_TEST_USERNAME: dispatch-ci
          RABBITMQ_TEST_PASSWORD: dispatch-ci-only
        run: python3 tests/dispatch_ors_integration.py --rabbit-management http://127.0.0.1:${{ job.services.rabbitmq.ports[15672] }}

  verify-dispatch-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: dispatch
          POSTGRES_PASSWORD: dispatch-ci-only
          POSTGRES_DB: dispatch
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U dispatch -d dispatch"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Build the optional PostgreSQL backend
        run: dotnet build Cassini.Offline.slnx -m:1 -p:NuGetAudit=false -p:EnableDispatchPostgres=true
      - name: Verify concurrent booking and restart with PostgreSQL
        env:
          ConnectionStrings__Dispatch: Host=127.0.0.1;Port=${{ job.services.postgres.ports[5432] }};Database=dispatch;Username=dispatch;Password=dispatch-ci-only
        run: python3 tests/dispatch_postgres_integration.py
