name: cassini-offline

x-service: &service
  pull_policy: never
  init: true
  networks: [operations]

# Health checks for `docker compose up --wait`. The aspnet runtime image has no curl or wget,
# so bash asks the service's own health endpoint through /dev/tcp and expects HTTP 200.
x-health: &health
  interval: 5s
  timeout: 3s
  retries: 24
  start_period: 10s

services:
  management:
    <<: *service
    image: cassini-offline/management:demo
    build:
      context: .
      args:
        PROJECT: src/Management/Cassini.Management.csproj
    command: ["Cassini.Management.dll"]
    healthcheck:
      <<: *health
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health/ready HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"]
    environment:
      Demo__DataDirectory: /state
      Situation__BaseUrl: http://situation:8080
    depends_on: [situation]
    volumes: [management:/state]

  situation:
    <<: *service
    image: cassini-offline/situation:demo
    build:
      context: .
      args:
        PROJECT: src/Situation/Situation.csproj
    command: ["Situation.dll"]
    healthcheck:
      <<: *health
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health/ready HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"]
    environment:
      Situation__StateFile: /state/situation.json
      Demo__Scenario: ${CASSINI_SCENARIO:-sample}
    volumes: [situation:/state]

  routing:
    <<: *service
    image: cassini-offline/routing:demo
    build:
      context: .
      args:
        PROJECT: src/Routing/Cassini.Routing.csproj
    command: ["Cassini.Routing.dll"]
    healthcheck:
      <<: *health
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health/ready HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"]
    environment:
      Situation__BaseUrl: http://situation:8080
      Routing__StatePath: /state/routing-draws.json
      Demo__Scenario: ${CASSINI_SCENARIO:-sample}
    depends_on: [situation]
    volumes: [routing:/state]

  dispatch:
    <<: *service
    image: cassini-offline/dispatch:demo
    build:
      context: .
      args:
        PROJECT: src/Dispatch/Cassini.Dispatch.csproj
    command: ["Cassini.Dispatch.dll"]
    healthcheck:
      <<: *health
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health/ready HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"]
    environment:
      Demo__DataDirectory: /state
      Situation__BaseUrl: http://situation:8080
      Routing__BaseUrl: http://routing:8080
      Management__BaseUrl: http://management:8080
    depends_on: [management, situation, routing]
    volumes: [dispatch:/state]

  gateway:
    <<: *service
    image: cassini-offline/gateway:demo
    build:
      context: .
      args:
        PROJECT: src/Gateway/Gateway.csproj
    command: ["Gateway.dll"]
    healthcheck:
      <<: *health
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"]
    environment:
      Services__Management: http://management:8080
      Services__Situation: http://situation:8080
      Services__Routing: http://routing:8080
      Services__Dispatch: http://dispatch:8080
      # Keycloak sign-in, off unless CASSINI_AUTH_ENABLED=true (profile `full`, see .env.example).
      Auth__Enabled: ${CASSINI_AUTH_ENABLED:-false}
      Auth__Url: http://localhost:${CASSINI_KEYCLOAK_PORT:-8180}
      Auth__MetadataAddress: http://keycloak:8080/realms/cassini/.well-known/openid-configuration
      Auth__RequireHttpsMetadata: "false"
      Demo__DataDirectory: /state
    depends_on: [management, situation, routing, dispatch]
    networks: [operations, local-ui]
    ports: ["127.0.0.1:${CASSINI_PORT:-5080}:8080"]
    volumes: [gateway:/state]

  # Profile `full`: local Keycloak with the synthetic `cassini` realm. Needs a pulled image and .env.
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    pull_policy: missing
    profiles: [full]
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:-}
      KC_HOSTNAME: http://localhost:${CASSINI_KEYCLOAK_PORT:-8180}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
      CASSINI_DEMO_PASSWORD: ${CASSINI_DEMO_PASSWORD:-}
      CASSINI_PORT: ${CASSINI_PORT:-5080}
    volumes:
      - ./deploy/keycloak/realm.json:/opt/keycloak/data/import/cassini-realm.json:ro
    networks: [local-ui]
    ports: ["127.0.0.1:${CASSINI_KEYCLOAK_PORT:-8180}:8080"]
    healthcheck:
      # The image has no curl: ask the management port through bash /dev/tcp.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

networks:
  operations:
    internal: true
  local-ui:
    driver: bridge

volumes:
  gateway:
  management:
  situation:
  routing:
  dispatch:
